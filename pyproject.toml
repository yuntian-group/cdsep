[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdsep"
version = "0.1.0"
description = "Control-Data Flow Separation: end-to-end prompt optimization for multi-agent LLM systems with typed control schemas."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Wentao Zhang" },
  { name = "Shariyar Murtaza" },
  { name = "Junaid Bhatti" },
  { name = "Utkarsh Soni" },
  { name = "Yifan Nie" },
  { name = "Eugene Wen" },
  { name = "Yuntian Deng" },
]
keywords = [
  "llm",
  "multi-agent",
  "prompt-optimization",
  "textgrad",
  "agent-framework",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["build>=1.2.0", "pytest>=7.0.0", "pytest-cov", "ruff", "mypy"]
anthropic = ["anthropic>=0.30.0"]
google = ["google-genai>=0.3.0"]
all-providers = ["anthropic>=0.30.0", "google-genai>=0.3.0"]
experiments = [
  "datasets>=2.0.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "anthropic>=0.30.0",
  "google-genai>=0.3.0",
]
dspy = ["dspy>=2.5.0"]

[project.urls]
Homepage = "https://github.com/yuntian-group/cdsep"
Repository = "https://github.com/yuntian-group/cdsep"
Issues = "https://github.com/yuntian-group/cdsep/issues"

[tool.setuptools.packages.find]
include = ["cdsep*"]
exclude = ["tests*", "experiments*", "examples*", "sections*", "figures*", "logs*"]

[tool.setuptools.package-data]
cdsep = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
